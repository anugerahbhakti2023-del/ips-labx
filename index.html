<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPS LABX - Laboratorium Ilmu Pengetahuan Sosial</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Courier New', Courier, monospace; /* Font diganti agar lebih terasa seperti sistem komputer/sci-fi */
    background: #020617;
    color: white;
    overflow-x: hidden; 
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
  }

  /* STATUS BAR (BARU) */
  .status-bar {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 5px 20px;
    background: rgba(2, 6, 23, 0.9);
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: cyan;
    border-bottom: 1px solid rgba(0, 255, 255, 0.3);
    z-index: 101;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* NAVBAR (Disempurnakan) */
  nav {
    position: fixed;
    top: 25px; /* Diturunkan sedikit memberi ruang untuk status bar */
    width: 100%;
    padding: 15px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(to bottom, rgba(2, 6, 23, 0.9), transparent);
    z-index: 100;
  }

  nav .brand {
    font-size: 1.5rem;
    font-weight: bold;
    color: white;
    text-shadow: 0 0 10px cyan;
    font-family: Arial, sans-serif;
  }

  nav ul {
    list-style: none;
    display: flex;
    gap: 30px;
    margin: 0;
    padding: 0;
  }

  nav ul li a {
    color: #94A3B8;
    text-decoration: none;
    font-weight: bold;
    transition: all 0.3s;
    font-family: Arial, sans-serif;
  }

  nav ul li a:hover {
    color: cyan;
    text-shadow: 0 0 8px cyan;
  }

  /* HERO SECTION */
  .hero {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    perspective: 1000px;
    text-align: center;
    font-family: Arial, sans-serif;
  }

  .logo {
    width: 280px;
    max-width: 80%;
    transition: transform 0.1s ease-out;
    filter: drop-shadow(0 0 30px cyan);
  }

  h1 {
    font-size: 3.5rem;
    margin-top: 20px;
    margin-bottom: 5px;
    letter-spacing: 3px;
    text-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
  }

  .subtitle {
    color: #94A3B8;
    margin-bottom: 30px;
    font-size: 1.1rem;
    letter-spacing: 1px;
  }

  /* BUTTON */
  .btn {
    padding: 12px 35px;
    border-radius: 4px;
    border: 1px solid cyan;
    background: rgba(0, 255, 255, 0.1);
    color: cyan;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-family: 'Courier New', Courier, monospace;
  }

  .btn:hover {
    background: cyan;
    color: #020617;
    box-shadow: 0 0 20px cyan;
  }

  /* MODAL HOLOGRAM (BARU) */
  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(8px);
    z-index: 1000;
  }

  .modal-content {
    background: rgba(2, 6, 23, 0.95);
    padding: 40px;
    width: 400px;
    border: 1px solid cyan;
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.2), inset 0 0 20px rgba(0, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
  }

  /* Efek Scanline CRT */
  .scanline {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 50px;
    background: linear-gradient(to bottom, transparent, rgba(0, 255, 255, 0.3), transparent);
    opacity: 0.5;
    animation: scan 3s linear infinite;
    pointer-events: none;
  }

  @keyframes scan {
    0% { top: -50px; }
    100% { top: 100%; }
  }

  .close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    color: cyan;
    font-size: 1.5rem;
    cursor: pointer;
    transition: color 0.3s;
    z-index: 10;
  }

  .close-btn:hover {
    color: white;
    text-shadow: 0 0 10px white;
  }

  /* Sistem Tab Form */
  .tabs {
    display: flex;
    margin-bottom: 25px;
    border-bottom: 1px solid rgba(0, 255, 255, 0.3);
  }

  .tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: #94A3B8;
    padding: 10px;
    cursor: pointer;
    font-family: 'Courier New', Courier, monospace;
    font-weight: bold;
    font-size: 1rem;
    transition: 0.3s;
  }

  .tab-btn.active {
    color: cyan;
    border-bottom: 2px solid cyan;
    text-shadow: 0 0 5px cyan;
  }

  .form-container {
    display: none;
  }

  .form-container.active {
    display: block;
    animation: fadeIn 0.4s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .input-group {
    margin-bottom: 15px;
    text-align: left;
  }

  .input-group label {
    display: block;
    font-size: 0.8rem;
    color: cyan;
    margin-bottom: 5px;
  }

  .modal-content input {
    width: 100%;
    padding: 10px;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(0, 255, 255, 0.3);
    color: white;
    outline: none;
    font-family: 'Courier New', Courier, monospace;
    transition: 0.3s;
  }

  .modal-content input:focus {
    border-color: cyan;
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
  }

  .modal-content .btn {
    width: 100%;
    margin-top: 10px;
  }

</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="status-bar">
  <div>SISTEM: <span style="color: white;">ONLINE</span> | KONEKSI SECURE</div>
  <div id="live-datetime">--:--:-- | --/--/----</div>
</div>

<nav>
  <div class="brand">IPS LABX</div>
  <ul>
    <li><a href="#beranda">BERANDA</a></li>
    <li><a href="#modul">MODUL</a></li>
    <li><a href="#tentang">TENTANG</a></li>
  </ul>
</nav>

<div class="hero" id="beranda">
  <img src="logo.png" class="logo" id="logo" alt="IPS LABX Logo" onerror="this.src='https://via.placeholder.com/280x280.png?text=LOGO+LABX'">
  <h1>IPS LABX</h1>
  <p class="subtitle">SISTEM EKSPLORASI RUANG, WAKTU & MASYARAKAT</p>
  <button class="btn" id="btnMulai">Inisiasi Akses</button>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="scanline"></div>
    <span class="close-btn" id="closeModal">&times;</span>
    
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">LOGIN</button>
      <button class="tab-btn" onclick="switchTab('register')">REGISTER</button>
    </div>

    <div id="form-login" class="form-container active">
      <div class="input-group">
        <label>> ID PENGGUNA / EMAIL</label>
        <input type="text" placeholder="Masukkan ID...">
      </div>
      <div class="input-group">
        <label>> KATA SANDI</label>
        <input type="password" placeholder="********">
      </div>
      <button class="btn">Masuk Sistem</button>
    </div>

    <div id="form-register" class="form-container">
      <div class="input-group">
        <label>> NAMA PENELITI</label>
        <input type="text" placeholder="Nama Lengkap...">
      </div>
      <div class="input-group">
        <label>> EMAIL / NISN</label>
        <input type="text" placeholder="Data Valid...">
      </div>
      <div class="input-group">
        <label>> KODE SANDI BARU</label>
        <input type="password" placeholder="Min. 8 Karakter...">
      </div>
      <button class="btn">Buat Kredensial</button>
    </div>

  </div>
</div>

<script>
// ==========================================
// 1. LOGIKA JAM & TANGGAL (STATUS BAR)
// ==========================================
function updateDateTime() {
  const now = new Date();
  const time = now.toLocaleTimeString('id-ID', { hour12: false });
  
  const day = String(now.getDate()).padStart(2, '0');
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const year = now.getFullYear();
  
  document.getElementById('live-datetime').innerText = `${time} | ${day}/${month}/${year}`;
}
setInterval(updateDateTime, 1000);
updateDateTime();

// ==========================================
// 2. LOGIKA TAB MODAL (LOGIN & REGISTER)
// ==========================================
function switchTab(tabId) {
  // Hapus class active dari semua tombol dan form
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.form-container').forEach(form => form.classList.remove('active'));

  // Tambahkan class active ke yang dipilih
  if(tabId === 'login') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('form-login').classList.add('active');
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('form-register').classList.add('active');
  }
}

// ==========================================
// 3. LOGIKA MODAL BUKA/TUTUP
// ==========================================
const btnMulai = document.getElementById("btnMulai");
const modal = document.getElementById("modal");
const closeModal = document.getElementById("closeModal");

btnMulai.addEventListener("click", () => {
  modal.style.display = "flex";
});

closeModal.addEventListener("click", () => {
  modal.style.display = "none";
});

window.addEventListener("click", (e) => {
  if (e.target === modal) {
    modal.style.display = "none";
  }
});

// ==========================================
// 4. ANIMASI PARTIKEL JARINGAN
// ==========================================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let mouse = { x: null, y: null };

document.addEventListener("mousemove", (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
document.addEventListener("mouseleave", () => {
  mouse.x = null;
  mouse.y = null;
});
window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

let particles = [];
const particleCount = window.innerWidth < 768 ? 150 : 320;

for (let i = 0; i < particleCount; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 1.5,
    vy: (Math.random() - 0.5) * 1.5
  });
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let mouseRadius = 150;

  for (let i = 0; i < particles.length; i++) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;

    let distMouse = 1000; 
    if (mouse.x !== null && mouse.y !== null) {
      let dxMouse = p.x - mouse.x;
      let dyMouse = p.y - mouse.y;
      distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);
      
      if (distMouse < 120) {
        p.x += (mouse.x - p.x) * 0.03;
        p.y += (mouse.y - p.y) * 0.03;
      }
    }

    if (distMouse < mouseRadius) {
      for (let j = i; j < particles.length; j++) {
        let p2 = particles[j];
        let dx = p.x - p2.x;
        let dy = p.y - p2.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 90) {
          ctx.beginPath();
          let opacity = 1 - (dist / 90);
          ctx.strokeStyle = `rgba(0, 255, 255, ${opacity * 0.8})`;
          ctx.lineWidth = 1;
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = "white";
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0, 255, 255, 0.5)";
      ctx.fill();
    }

    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
  }
  requestAnimationFrame(animate);
}
animate();

// ==========================================
// 5. ANIMASI LOGO 3D
// ==========================================
const logo = document.getElementById("logo");
document.addEventListener("mousemove", (e) => {
  if(window.scrollY > window.innerHeight / 2) return;
  let xAxis = (window.innerWidth / 2 - e.clientX) / 25;
  let yAxis = (window.innerHeight / 2 - e.clientY) / 25;
  logo.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
});
document.addEventListener("mouseleave", () => {
  logo.style.transform = `rotateY(0deg) rotateX(0deg)`;
});
</script>

</body>
</html>
